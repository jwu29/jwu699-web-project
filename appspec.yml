version: 0.0
os: linux
files:
  # Staged here; scripts/deploy_war.sh moves it into Tomcat's webapps,
  # whose path depends on the Tomcat version installed.
  - source: /target/jwu699-web-project.war
    destination: /opt/jwu699/
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/deploy_war.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
